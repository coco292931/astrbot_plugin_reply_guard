name: astrbot_plugin_reply_guard
display_name: 群聊回复守卫
version: 0.1.5
author: coco
short_desc: 群聊关键词精准回复（xlsx 表）、全局回复概率门、LLM 敏感词拦截、/q 引用图。
desc: |
  给群聊做守门的插件，四件事：

  1. 关键词精准回复：从 xlsx 读 A 列关键词、B 列回复内容，消息与关键词完全一致时
     直接回复表格内容，该条消息不进入 LLM、不写入历史。A/B 任一为空的行跳过，
     同关键词重复出现时以靠下的行为准。表文件改完自动热重载。
  2. 回复概率门：没命中关键词的消息按全局概率决定是否交给 LLM；没通过概率的消息
     不回复也不落盘，历史里只留下真正发生过对话的消息。
  3. 敏感词拦截：LLM 生成完毕后检查回复正文，命中敏感词则整条跳过，
     消息同样不写入历史。
  4. /q 引用图：引用消息后发送 /q，按聊天气泡样式渲染引用图，支持嵌套引用和多条
     群消息（/q N，最多 10 条），消息里有动态表情时输出动态 GIF，不依赖外部渲染服务。
astrbot_version: ">=4.0.0"
repo: https://github.com/coco292931/astrbot_plugin_reply_guard
